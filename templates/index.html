<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Python HTML Example</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
      padding: 32px;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 28px;
    }

    h1 {
      margin-top: 0;
    }

    .number {
      font-size: 40px;
      font-weight: 800;
      margin: 16px 0;
    }

    .bar {
      height: 18px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
    }

    .bar span {
      display: block;
      height: 100%;
      width: {{ progress_percent }}%;
      background: #2563eb;
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello {{ user_name }}</h1>

    <p>This page is HTML, but these values come from Python.</p>

    <div class="number">{{ progress_percent }}%</div>

    <p>You completed {{ tasks_done }} of {{ tasks_total }} tasks.</p>

    <div class="bar">
      <span></span>
    </div>
  </main>
</body>
</html>
